services:
  - type: web
    name: limbus-api
    runtime: docker
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:4200
